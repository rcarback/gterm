name: gterm
options:
  bundleIdPrefix: io.github.madeye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/rcarback/swift-nio-ssh.git
    revision: 94d5a7683c0cae93d20db5e2702b351f33a82112
  SwiftCrypto:
    url: https://github.com/rcarback/swift-crypto.git
    revision: 23ddb5ee80893254a9b353668843aff5166dc4cc
  # LLM streaming (SSE) follows the runse project: it streams via these SDKs
  # rather than hand-parsing Server-Sent Events.
  OpenAI:
    url: https://github.com/MacPaw/OpenAI
    from: "0.4.9"
  SwiftAnthropic:
    url: https://github.com/jamesrochabrun/SwiftAnthropic
    from: "2.2.2"

settings:
  base:
    MARKETING_VERSION: "1.3"
    # Build number is the build date (YYYYMMDD); pass CURRENT_PROJECT_VERSION
    # explicitly per build (e.g. `CURRENT_PROJECT_VERSION=$(date +%Y%m%d)`).
    CURRENT_PROJECT_VERSION: "20260907"
    # Team id is not committed — XcodeGen expands it from the environment.
    # Copy env.example to .env, then: set -a; source .env; set +a; xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # Low-level C interop (Unmanaged, C function-pointer callbacks) is much
    # simpler under the Swift 5 language mode than Swift 6 strict concurrency.
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    # GhosttyKit's iOS-simulator slice is arm64-only (ghostty doesn't build an
    # x86_64 simulator slice), so exclude x86_64 for the simulator. This Mac is
    # Apple Silicon, so the simulator runs arm64 anyway.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  gterm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: gterm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # SSH needs to reach hosts on the local network too.
        NSLocalNetworkUsageDescription: gterm connects to SSH servers, which may be on your local network.
        # Allow cleartext http to loopback/link-local/.local so the in-app browser
        # can load http://127.0.0.1:<port> served by a tunneled port forward.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.gterm
        PRODUCT_NAME: gterm
        TARGETED_DEVICE_FAMILY: "1,2"
        # App icon lives in Assets.xcassets/AppIcon.appiconset; this also injects
        # CFBundleIconName, which the App Store requires for upload.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keychain (saved SSH passwords) requires the app to be signed with an
        # application-identifier entitlement. Xcode's automatic signing with a
        # team provides this; the entitlements file declares the keychain group.
        CODE_SIGN_ENTITLEMENTS: gterm.entitlements
        CODE_SIGN_STYLE: Automatic
        # GhosttyKit is a static Zig library; -ObjC pulls in its ObjC categories
        # and -lstdc++ satisfies the C++ (simdutf/highway) bits it links.
        OTHER_LDFLAGS: [-ObjC, -lstdc++]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCrypto
        product: _CryptoExtras
      - package: OpenAI
      - package: SwiftAnthropic
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework

  # Logic-only test bundle for the LLM autocompletion core. It compiles the
  # Foundation-only Sources/LLM files directly (no GhosttyKit / UIKit), so the
  # tests are fast and hermetic and need no host app.
  gtermTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Sources/LLM
      # Foundation-safe units covered by the audit (no GhosttyKit / UIKit).
      - path: Sources/SSH/SSHKeyParser.swift
      - path: Sources/SSH/SSHKeyGenerator.swift
      - path: Sources/Model/KeyStore.swift
      - path: Sources/Model/Keychain.swift
      - path: Sources/SSH/KnownHosts.swift
      - path: Sources/SSH/ChannelCloseOnce.swift
      - path: Sources/SSH/SSHExecHandler.swift
      - path: Sources/SSH/PTYChannelHandler.swift
      - path: Sources/Screen
      - path: Sources/Terminal/TerminalTapMovement.swift
      - path: Sources/Terminal/SessionRecovery.swift
      - path: Sources/SSH/SessionStateNotifier.swift
      - path: Sources/SSH/SSHPort.swift
      - path: Sources/Model/SavedConnection.swift
      - path: Sources/SSH/SSHConnection.swift
      - path: Sources/SSH/SSHTransport.swift
      - path: Sources/SSH/SSHWrapperHandler.swift
      - path: Sources/SSH/OrderedAuthDelegate.swift
      - path: Sources/Model/CommandHistory.swift
      - path: Sources/Model/HerdrSupport.swift
      - path: Sources/Model/ConnectionStore.swift
      - path: Sources/SSH/KeepaliveTracker.swift
      - path: Sources/Terminal/BackgroundTaskAssertion.swift
    dependencies:
      - package: SwiftNIO
        product: NIOEmbedded
      - package: OpenAI
      - package: SwiftAnthropic
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCrypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.gtermTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  gtermScreenTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Screen
      - path: Sources/Terminal/TerminalTapMovement.swift
      - path: Sources/Terminal/SessionRecovery.swift
      - path: Tests/TerminalTapMovementTests.swift
      - path: Tests/SessionRecoveryTests.swift
      - path: Sources/SSH/SSHExecHandler.swift
      - path: Sources/SSH/PTYChannelHandler.swift
      # PTYChannelHandler takes its startup program from HerdrSupport.PTYStart;
      # HerdrSupport also carries the SavedConnection codec.
      - path: Sources/Model/HerdrSupport.swift
      - path: Sources/Model/SavedConnection.swift
      - path: Sources/SSH/ChannelCloseOnce.swift
      - path: Tests/ScreenProtocolTests.swift
      - path: Tests/ScreenControllerTests.swift
      - path: Tests/SSHExecHandlerTests.swift
    dependencies:
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOEmbedded
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  gtermIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
      - path: Tests/GeneratedKeyAuthenticationTests.swift
    dependencies:
      - target: gterm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/gterm.app/gterm
        BUNDLE_LOADER: $(TEST_HOST)
        OTHER_SWIFT_FLAGS: $(inherited) -DKEYGEN_HOSTED_TESTS

  gtermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: gterm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: gterm

  gtermKeyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SSHKeyGeneratorTests.swift
      - path: Tests/SSHKeyGenerationWorkerTests.swift
      - path: Tests/GeneratedKeyAuthenticationTests.swift
      - path: Sources/SSH/SSHKeyGenerator.swift
      - path: Sources/SSH/SSHKeyParser.swift
      - path: Sources/SSH/KnownHosts.swift
      - path: Sources/Model/KeyStore.swift
      - path: Sources/Model/Keychain.swift
    dependencies:
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCrypto
        product: _CryptoExtras
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Runs real shell-startup regressions on macOS as well as SSH channel tests.
  # Process is unavailable on iOS, so these tests need a host-side bundle.
  gtermSSHTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/HerdrAutoAttachTests.swift
      - path: Sources/Model/HerdrSupport.swift
      - path: Sources/Model/ConnectionStore.swift
      - path: Sources/Model/SavedConnection.swift
      - path: Sources/Model/Keychain.swift
      - path: Sources/SSH/PTYChannelHandler.swift
      # PTYChannelHandler reports startup/exit failures as SSHExecError.
      - path: Sources/SSH/SSHExecHandler.swift
      - path: Sources/SSH/ChannelCloseOnce.swift
    dependencies:
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOEmbedded
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.gtermSSHTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScreenValidation:
    build:
      targets:
        gtermScreenTests: all
    test:
      targets:
        - gtermScreenTests
  gterm:
    build:
      targets:
        gterm: all
  KeyGenerationValidation:
    build:
      targets:
        gterm: all
    test:
      targets:
        - gtermIntegrationTests
        - gtermUITests
